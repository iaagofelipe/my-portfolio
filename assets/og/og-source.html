<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0b;
    color: #f4f2ec;
    font-family: "Archivo", system-ui, sans-serif;
    padding: 64px 72px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid rgba(244, 242, 236, 0.14);
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "Spline Sans Mono", monospace;
    font-size: 19px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .top .role { color: #8f8c84; letter-spacing: 0.12em; font-size: 16px; }
  .mid { display: flex; gap: 34px; align-items: stretch; }
  .bar { width: 3px; background: #e0983f; flex: none; }
  h1 {
    font-size: 76px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.038em;
    max-width: 15ch;
  }
  .sub {
    margin-top: 26px;
    font-family: "Spline Sans Mono", monospace;
    font-size: 19px;
    letter-spacing: 0.02em;
    color: #bdbab2;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 22px;
    border-top: 1px solid rgba(244, 242, 236, 0.2);
    font-family: "Spline Sans Mono", monospace;
    font-size: 17px;
    letter-spacing: 0.08em;
    color: #8f8c84;
  }
  .foot .url { color: #f4f2ec; }
</style>
</head>
<body>
  <div class="top">
    <span>Iago Silva</span>
    <span class="role">Backend · AWS · Microsserviços</span>
  </div>

  <div class="mid">
    <div class="bar"></div>
    <div>
      <h1>Backend Java para o caminho crítico.</h1>
      <p class="sub">seis anos · Java · AWS · mensageria · 209 testes no Slinks</p>
    </div>
  </div>

  <div class="foot">
    <span class="url">iaagofelipe.github.io/my-portfolio</span>
    <span>Fortaleza · BR · UTC−3</span>
  </div>
</body>
</html>
